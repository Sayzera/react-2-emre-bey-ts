[build]
  command = "npm run build"
  publish = "dist"

  
# Statik dosyalar için özel kural (opsiyonel)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = false

# Tüm diğer route'ları index.html'e yönlendir
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true